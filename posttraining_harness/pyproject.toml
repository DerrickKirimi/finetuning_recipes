[project]
name = "posttraining-harness"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "trl==0.24.0",
    "datasets==3.6.0",
    "neural-txt[hf]==0.1.6",
    "text-albumentations==2.1.0",
    "pytest>=8,<9",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
