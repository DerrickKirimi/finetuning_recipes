[project]
name = "unsloth-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "absl-py>=2.4.0",
    "arxiv>=2.4.0",
    "bert-score>=0.3.13",
    "datasets==3.6",
    "evaluate>=0.4.6",
    "gradio>=6.11.0",
    "instructor>=1.14.5",
    # "mlx; sys_platform == 'darwin'",
    # "mlx-lm>=0.31.1; sys_platform == 'darwin'",
    "outlines>=1.2.12",
    "peft>=0.18.1",
    "pip>=26.0.1",
    "pypdf>=6.6.2",
    "rich>=14.3.2",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "text-albumentations==2.1.0",
    # torch 2.8 on linux/x86_64: newest torch with a prebuilt flash-attn cu12 wheel
    # (torch 2.9 flash-attn wheels are cu13-only; torch 2.10 has none). torchvision and
    # xformers are version-locked to torch, so they must be downgraded together.
    "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch>=2.7; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.25.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "sentence-transformers>=3.0.0",
    "transformers==4.57.6",
    "trl==0.24.0",
    "unsloth>=2026.1.4",
    "xformers==0.0.32.post2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "neural-txt[hf]>=0.1.6",
    "mlx>=0.31.2; sys_platform == 'darwin'",
    "mlx-lm>=0.29.1; sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
xformers = { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
